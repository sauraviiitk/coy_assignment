<script>
  function fillPrompt(text) {
    const input = document.getElementById('matchMessageInput');
    const clearBtn = document.getElementById('clearMsgBtn');
    input.value = text;
    input.focus();
    if (clearBtn) {
      clearBtn.classList.remove('opacity-0', 'pointer-events-none');
    }
  }

  const msgInput = document.getElementById('matchMessageInput');
  const clearBtn = document.getElementById('clearMsgBtn');
  if (msgInput && clearBtn) {
    msgInput.addEventListener('input', (e) => {
      if (e.target.value.trim().length > 0) {
        clearBtn.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        clearBtn.classList.add('opacity-0', 'pointer-events-none');
      }
    });
  }

  const sendBtn = document.getElementById('sendMessageBtn');
  if (sendBtn) {
    sendBtn.addEventListener('click', () => {
      const val = msgInput.value.trim() || "👋 Hey Aanya!";
      sendBtn.innerHTML = `<span>Sent! ✨</span><span class="material-symbols-outlined text-[20px]">check</span>`;
